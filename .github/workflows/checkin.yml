name: checkin

on:
  schedule:
    # 覆盖 UTC+8 05:00-14:00（含13:30后缓冲），每30分钟一次，避开整点高峰
    - cron: "13,43 21-23,0-6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    # 最长等待：05:00 签到成功 -> 09:00 推送 = 4 小时，加构建缓冲
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_COOKIE: ${{ secrets.TARGET_COOKIE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          MASK_WORDS: ${{ secrets.MASK_WORDS }}
        run: python checkin.py
